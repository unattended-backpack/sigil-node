# Configuration for running a full Sigil sequencer in the event the centralized Sigil sequencer is down.

services:
  op-node:
    entrypoint: /scripts/exit/start-op-node.sh

  op-geth:
    entrypoint: /scripts/exit/start-op-geth.sh

  op-succinct-validity:
    # Succinct doesn't have a public image repository so we hosted our own image.
    # You're welcome to build your own and use it here instead: github.com/succinctlabs/op-succinct/tree/v2.3.0
    image: jossduff/op-succinct-validity:v2.3.0
    entrypoint: /scripts/exit/start-op-succinct-validity.sh
    env_file:
      - .env
    volumes:
      - ./scripts:/scripts
      # op-succinct-validity expects the up-to-date `configs/51611.json` at this location 
      # in the container
      - ./config:/app/configs
      - validity-tmp:/tmp
    ports:
      - ${PORT__OP_SUCCINCT_VALIDITY_HTTP:-3001}:${PORT__OP_SUCCINCT_VALIDITY_HTTP:-3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - L1_RPC=${L1_RPC_URL}
      - L1_BEACON_RPC=${L1_BEACON_RPC_URL}
      - L2_RPC=http://op-geth:8545
      - L2_NODE_RPC=http://op-node:9545
      # use the OP_SUCCINCT_DATABASE_URL if provided, otherwise use the local postgres db container
      - DATABASE_URL=${OP_SUCCINCT_VALIDITY_DATABASE_URL:-postgres://op-succinct@postgres:5432/op-succinct}
      - RUST_LOG_STYLE=always
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      - NETWORK_RPC_URL=http://hierophant:${PORT__HIEROPHANT_GRPC:-9000}
      - SP1_PROVER=network
    depends_on:
      - postgres
      - op-geth
      - op-node
      - hierophant
      - magister
    restart: unless-stopped

  # Used to store proof requests for op-succinct-validity
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: op-succinct
      POSTGRES_DB: op-succinct
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # locally hosted prover network
  hierophant:
    image: jossduff/hierophant:latest
    entrypoint: /scripts/exit/start-hierophant.sh
    env_file:
      - .env
    volumes:
      - ./scripts:/scripts
    ports:
      - ${PORT__HIEROPHANT_HTTP:-9010}:${PORT__HIEROPHANT_HTTP:-9010}
      - ${PORT__HIEROPHANT_GRPC:-9000}:${PORT__HIEROPHANT_GRPC:-9000}
    environment:
      - PORT__HIEROPHANT_HTTP=${PORT__HIEROPHANT_HTTP:-9010}
      - PORT__HIEROPHANT_GRPC=${PORT__HIEROPHANT_GRPC:-9000}
      - RUST_LOG_STYLE=always
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # manages worker nodes who execute proofs for Hierophant
  magister:
    image: jossduff/magister:latest
    entrypoint: /scripts/exit/start-magister.sh
    env_file:
      - .env
    volumes:
      - ./scripts:/scripts
    ports:
      - ${PORT__MAGISTER_HTTP:-8555}:${PORT__MAGISTER_HTTP:-8555}
    environment:
      - PORT__MAGISTER_HTTP=${PORT__MAGISTER_HTTP:-8555}
      - RUST_LOG_STYLE=always
      - RUST_LOG=info
      - RUST_BACKTRACE=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - hierophant
    restart: unless-stopped

volumes:
  postgres-data:
  validity-tmp:
