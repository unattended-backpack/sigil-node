# Base configuration.  Not meant to be used by itself, use either
# docker-compose.node.yml or docker-compose.exit.yml as overrides

services:
  op-node: 
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.13.3
    restart: unless-stopped
    stop_grace_period: 5m
    env_file:
      # Maintainer set values like contract addresses, chain ids, etc
      - .env.maintainer
      # Values required to be set by end user like private key, rpcs, and api keys
      - .env
    volumes:
      - ./config:/chainconfig
      - ./scripts:/scripts
      - shared:/shared
      - safedb:/safedb
      - opnode_p2p_priv:/opnode_p2p_priv
    ports:
      - ${PORT__OP_NODE_P2P}:${PORT__OP_NODE_P2P}/udp
      - ${PORT__OP_NODE_P2P}:${PORT__OP_NODE_P2P}/tcp
      - ${PORT__OP_NODE_HTTP}:${PORT__OP_NODE_HTTP}
      - 7300:7300
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      initialize:
        condition: service_completed_successfully

  op-geth: 
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-geth:v1.101511.0
    restart: unless-stopped
    stop_grace_period: 5m
    env_file:
      # Maintainer set values like contract addresses, chain ids, etc
      - .env.maintainer
      # Values required to be set by end user like private key, rpcs, and api keys
      - .env
    volumes:
      - ./config:/chainconfig
      - ./scripts:/scripts
      - shared:/shared
      - datadir:/datadir
    ports:
      - ${PORT__OP_GETH_HTTP}:${PORT__OP_GETH_HTTP}
      - ${PORT__OP_GETH_WS}:${PORT__OP_GETH_WS}
      - ${PORT__OP_GETH_P2P}:${PORT__OP_GETH_P2P}/udp
      - ${PORT__OP_GETH_P2P}:${PORT__OP_GETH_P2P}/tcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      initialize:
        condition: service_completed_successfully

  # initializes datadir and jwt.txt, then writes INITIALIZED.txt
  initialize:
    image: alpine:latest
    command: /bin/sh -c "apk add --no-cache openssl && /scripts/initialize.sh"
    env_file:
      # Maintainer set values like contract addresses, chain ids, etc
      - .env.maintainer
      # Values required to be set by end user like private key, rpcs, and api keys
      - .env
    volumes:
      - ./scripts:/scripts
      - shared:/shared
      - datadir:/datadir
    restart: "no"

volumes:
  datadir: # chain data
  shared: # for storing jwt.txt and INITIALIZED.txt
  safedb: # for op-node
  opnode_p2p_priv: # private key for op-node peer ID.  Important for maintaining the same network identity after restarting
